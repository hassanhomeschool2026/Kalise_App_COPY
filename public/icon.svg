<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0e2a36" />
    </linearGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="petal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Ambient Breathing Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Glow underneath -->
  <circle cx="256" cy="256" r="90" fill="url(#centerGlow)" filter="url(#softGlow)" />

  <!-- Kalise Sacred Petal Harmony (Zen Balance) -->
  <g transform="translate(256, 256)" filter="url(#softGlow)">
    <!-- Leaf / Petal 1 -->
    <path d="M 0,-110 C 60,-80 80,-20 0,60 C -80,-20 -60,-80 0,-110 Z" fill="url(#petal1)" transform="rotate(0)" />
    <!-- Leaf / Petal 2 -->
    <path d="M 0,-110 C 60,-80 80,-20 0,60 C -80,-20 -60,-80 0,-110 Z" fill="url(#petal2)" transform="rotate(72)" />
    <!-- Leaf / Petal 3 -->
    <path d="M 0,-110 C 60,-80 80,-20 0,60 C -80,-20 -60,-80 0,-110 Z" fill="url(#petal1)" transform="rotate(144)" />
    <!-- Leaf / Petal 4 -->
    <path d="M 0,-110 C 60,-80 80,-20 0,60 C -80,-20 -60,-80 0,-110 Z" fill="url(#petal2)" transform="rotate(216)" />
    <!-- Leaf / Petal 5 -->
    <path d="M 0,-110 C 60,-80 80,-20 0,60 C -80,-20 -60,-80 0,-110 Z" fill="url(#petal1)" transform="rotate(288)" />

    <!-- Center pearl core -->
    <circle cx="0" cy="0" r="18" fill="#f8fafc" />
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.6" />
  </g>
</svg>
